<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Dental AI Model Pipeline</title>
  <style>
    :root {
      --paper: #f7faf9;
      --ink: #172635;
      --muted: #516476;
      --panel: #ffffff;
      --line: #6e8799;
      --blue: #2565a8;
      --teal: #087d78;
      --green: #4f8e46;
      --amber: #c4861c;
      --coral: #bc5a52;
      --violet: #6f5ab8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid #d9e4e6;
      background: rgba(247, 250, 249, 0.96);
      backdrop-filter: blur(8px);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      gap: 7px;
      border: 1px solid #bfd0d6;
      border-radius: 8px;
      padding: 8px 12px;
      color: #102334;
      background: #ffffff;
      font: 700 13px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    button:hover {
      border-color: #86aab4;
      background: #edf7f6;
    }

    main {
      display: grid;
      gap: 24px;
      padding: 22px;
    }

    .diagram-block {
      overflow: auto;
      border: 1px solid #d9e3e6;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(20, 39, 57, 0.08);
    }

    svg.pipeline {
      display: block;
      width: 100%;
      min-width: 1380px;
      height: auto;
      background: #fbfdfc;
    }

    body.export-mode .toolbar { display: none; }
    body.export-mode main { gap: 0; padding: 0; }
    body.export-mode .diagram-block {
      overflow: hidden;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    body.export-mode svg.pipeline {
      width: 1800px;
      min-width: 0;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>Full Dental AI Pipeline: Training and Testing</h1>
    <div class="actions">
      <button type="button" onclick="exportSvg('trainingDiagram', 'fkg_model_training.png')">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Training PNG
      </button>
      <button type="button" onclick="exportSvg('testingDiagram', 'fkg_model_testing.png')">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Testing PNG
      </button>
      <button type="button" onclick="exportBoth()">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 7V5a2 2 0 0 1 2-2h9v14h-2M5 7h9v14H5zM8 11h3M8 15h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    </div>
  </header>

  <script>
    function getSvgSize(svg) {
      const viewBox = svg.getAttribute("viewBox").split(/\s+/).map(Number);
      return { width: viewBox[2], height: viewBox[3] };
    }

    function inlineComputedStyles(svg) {
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.querySelectorAll("*").forEach((node) => {
        const style = window.getComputedStyle(node);
        if (node.tagName.toLowerCase() === "text") {
          node.setAttribute("font-family", style.fontFamily);
          node.setAttribute("font-size", style.fontSize);
          node.setAttribute("font-weight", style.fontWeight);
          node.setAttribute("letter-spacing", "0");
        }
      });
      return clone;
    }

    async function exportSvg(svgId, filename) {
      const svg = document.getElementById(svgId);
      const { width, height } = getSvgSize(svg);
      const scale = 2.4;
      const clone = inlineComputedStyles(svg);
      const xml = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      try {
        const img = new Image();
        const loaded = new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });
        img.src = url;
        await loaded;

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fbfdfc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        link.remove();
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function exportBoth() {
      exportSvg("trainingDiagram", "fkg_model_training.png");
      window.setTimeout(() => exportSvg("testingDiagram", "fkg_model_testing.png"), 500);
    }

    function applyViewMode() {
      const view = new URLSearchParams(window.location.search).get("view");
      if (!view) {
        return;
      }
      document.body.classList.add("export-mode");
      const trainingBlock = document.getElementById("trainingDiagram").closest(".diagram-block");
      const testingBlock = document.getElementById("testingDiagram").closest(".diagram-block");
      if (view === "training") {
        testingBlock.hidden = true;
      } else if (view === "testing") {
        trainingBlock.hidden = true;
      }
    }

    applyViewMode();
  </script>
